apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: redis
    tier: backend
spec:
  containers:
    - name: redis
      image: python:3.13-slim
      restartPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
           exec python -u /tmp/server.py
      volumeMounts:
        - mountPath: /tmp/server.py
          name: backend
          readOnly: true
  volumes:
    - name: backend
      hostPath:
        path: /tmp/backend.py
        type: File
