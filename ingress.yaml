apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  ingressClassName: nginx            
  rules:
    - host: ingress.workshop.local   
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx          
                port:
                  number: 1337
