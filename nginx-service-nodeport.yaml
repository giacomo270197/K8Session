# NodePort Service: opens the same port on EVERY node's IP and forwards it to the
# nginx Pods. It also gets a ClusterIP, so it works inside the cluster too.
# nodePort must be in the cluster's NodePort range (default 30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  labels:
    app: nginx
    tier: frontend
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 1337          
      nodePort: 80     
      protocol: TCP
