apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx              
  template:
    metadata:
      labels:
        app: nginx           
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: python:3.13-slim
          command: ["python", "-u", "/tmp/server.py"] 
          ports:
            - name: http
              containerPort: 1337
          volumeMounts:
            - mountPath: /tmp/server.py
              name: frontend
              readOnly: true
      volumes:
        - name: frontend
          hostPath:
            path: /tmp/frontend.py
            type: File 
