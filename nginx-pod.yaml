apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
    tier: frontend
spec:
  initContainers:
    # Native sidecar (restartPolicy: Always): starts before the main container
    # and keeps running for the pod's lifetime. Requires Kubernetes >= 1.29.
    - name: webserver
      image: python:3.13-slim
      restartPolicy: Always
      env:
        - name: SCRIPT_URL
          value: "https://raw.githubusercontent.com/<GH_USER>/<GH_REPO>/main/frontend.py"
        - name: BACKEND_URL
          value: "http://<REDIS_POD_IP>:1337"   # get it with: kubectl get pod redis -o wide
      command: ["sh", "-c"]
      args:
        - |
          python -c "import os, urllib.request; urllib.request.urlretrieve(os.environ['SCRIPT_URL'], '/tmp/server.py')" \
          && exec python -u /tmp/server.py
      ports:
        - name: http
          containerPort: 1337
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - name: http-nginx
          containerPort: 80
