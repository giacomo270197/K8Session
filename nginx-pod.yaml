apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
    tier: frontend
spec:
  containers:
    - name: nginx
      image: python:3.13-slim
      restartPolicy: Always
      env:
      command: ["sh", "-c"]
      args:
        - |
          exec python -u /tmp/server.py
      volumeMounts:
        - mountPath: /tmp/server.py
          name: frontend
          readOnly: true
  volumes:
    - name: frontend
      hostPath:
        path: /tmp/frontend.py
        type: File
