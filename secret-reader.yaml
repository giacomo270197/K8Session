apiVersion: v1
kind: Secret
metadata:
  name: supersecret
  namespace: default
type: Opaque
stringData:                  
  username: admin
  password: "S3cr3t!"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-secret
  namespace: default
rules:
  - apiGroups: [""]                    
    resources: ["secrets"]
    resourceNames: ["supersecret"]
    verbs: ["get"]                  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-secret
