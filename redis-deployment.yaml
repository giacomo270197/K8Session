apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis             
  template:
    metadata:
      labels:
        app: redis            
        tier: backend
    spec:
      containers:
        - name: redis
          image: python:3.13-slim
          command: ["python", "-u", "/tmp/server.py"]
          ports:
            - name: http
              containerPort: 1337
          volumeMounts:
            - mountPath: /tmp/server.py
              name: backend
              readOnly: true
      volumes:
        - name: backend
          hostPath:
            path: /tmp/backend.py
            type: File       
